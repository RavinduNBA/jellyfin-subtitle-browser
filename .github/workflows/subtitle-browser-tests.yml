name: Subtitle Browser tests
on:
  push:
    branches: [subtitle-browser]
  pull_request:
jobs:
  javascript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parser, lifecycle and preference tests
        shell: pwsh
        run: ./subtitle-browser/Test.ps1
      - name: Validate release scripts
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "Invalid script: $($_.Name)"}
          }
